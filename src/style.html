<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout : barre du haut ; bibliothèque en deux colonnes (UE à gauche, annales à droite) dès la largeur iPad ; mode entraînement en colonne centrée avec barre d'action collée en bas */
:root{
  --bg:#f2f2f5; --surface:#ffffff; --raise:#f8f8fa; --fg:#16161b; --muted:#666672; --line:#e0e0e6;
  --red:#d7263d; --red-soft:#fce7ea; --on-red:#ffffff; --ok:#1d8a4b; --ok-soft:#e3f4ea; --ko:#d7263d;
  --shadow:0 1px 2px rgba(20,20,30,.06),0 4px 14px rgba(20,20,30,.05);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101013; --surface:#1a1a1f; --raise:#222228; --fg:#ececf1; --muted:#9b9ba8; --line:#2d2d35;
  --red:#ff4d5e; --red-soft:#3a1a20; --on-red:#1c070b; --ok:#4cc27f; --ok-soft:#173224; --ko:#ff6b78;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101013; --surface:#1a1a1f; --raise:#222228; --fg:#ececf1; --muted:#9b9ba8; --line:#2d2d35;
  --red:#ff4d5e; --red-soft:#3a1a20; --on-red:#1c070b; --ok:#4cc27f; --ok-soft:#173224; --ko:#ff6b78;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.03em;line-height:1;margin:0;display:flex;align-items:baseline}
.brand i{width:.32em;height:.32em;border-radius:50%;background:var(--red);display:inline-block;margin-left:.06em}
.sync{font-size:.8rem;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;min-height:34px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
/* bibliothèque */
.lib{max-width:1180px;margin:0 auto;display:grid;gap:24px;padding-block:20px 40px}
@media (min-width:860px){.lib{grid-template-columns:260px minmax(0,1fr)}}
.ues{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
@media (min-width:860px){.ues{flex-direction:column;overflow:visible;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start}}
.ue{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;text-align:left;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;min-width:150px}
.ue b{font-weight:600}
.ue small{color:var(--muted);font-size:.8rem;grid-column:1/-1;font-variant-numeric:tabular-nums}
.ue .avg{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.ue[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.ue[aria-pressed="true"] .avg{color:var(--red)}
.side-h{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 2px;display:none}
@media (min-width:860px){.side-h{display:block}}
.main-h{display:flex;flex-wrap:wrap;align-items:end;gap:12px 16px;margin-bottom:16px}
.main-h h2{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.3rem);letter-spacing:-.02em;margin:0;flex:1 1 240px;text-wrap:balance;line-height:1.05}
.main-h h2 span{display:block;font-family:var(--body);font-size:.9rem;font-weight:600;color:var(--muted);letter-spacing:0;margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools select{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--red)}
.card h3{margin:0;font-size:1.15rem;line-height:1.2;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--raise);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px}
.note{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.note b{font-family:var(--display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.note b small{font-size:.9rem;color:var(--muted);font-weight:600}
.card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.card .row .btn{flex:1}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:28px;display:grid;gap:14px;max-width:62ch}
.empty h3{font-family:var(--display);font-size:1.5rem;margin:0}
.empty p{margin:0;color:var(--muted)}
.empty .row{display:flex;flex-wrap:wrap;gap:10px}
/* entraînement */
.play{max-width:880px;margin:0 auto;padding-block:14px 120px}
.pbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.pbar .t{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.pprog{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.pprog i{display:block;height:100%;background:var(--red);transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.chip.red{background:var(--red-soft);border-color:transparent;color:var(--red)}
details.enonce{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
details.enonce summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;min-height:44px;align-items:center}
details.enonce summary::after{content:"Afficher";color:var(--red);font-size:.9rem}
details.enonce[open] summary::after{content:"Masquer"}
details.enonce .crops{padding:0 10px 10px}
.crops{display:grid;gap:8px}
.crop{position:relative;container-type:inline-size;--k:calc(100cqw / var(--cw));background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.crop canvas{display:block;width:100%;height:auto}
.crop.loading{min-height:120px}
.opt{position:absolute;background:#fff;border:0;padding:0 0 0 calc(var(--k)*2);display:flex;align-items:center;gap:calc(var(--k)*5);cursor:pointer;font:600 calc(var(--k)*11)/1 "Times New Roman",Times,serif;color:#111;border-radius:calc(var(--k)*3)}
.opt::before{content:"";position:absolute;inset:calc(var(--k)*-3) calc(var(--k)*-2)}
.box{width:calc(var(--k)*12);height:calc(var(--k)*12);border:calc(var(--k)*1.4) solid #555;border-radius:calc(var(--k)*2.5);display:grid;place-items:center;font:700 calc(var(--k)*9)/1 var(--body);color:#fff;flex:none}
.opt.round .box{border-radius:50%}
.opt.sel .box{background:#16161b;border-color:#16161b}
.opt.sel .box::after{content:"✓"}
.done .opt{cursor:default}
.done .opt.sel.v .box{background:#1d8a4b;border-color:#1d8a4b}
.done .opt.sel.f .box{background:#d7263d;border-color:#d7263d}
.done .opt.sel.f .box::after{content:"✕"}
.done .opt.v:not(.sel) .box{border-color:#1d8a4b;border-style:dashed;color:#1d8a4b}
.done .opt.v:not(.sel) .box::after{content:"✓"}
.qroc{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.qroc input{flex:1 1 240px;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font-size:1.05rem}
.qroc input:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 3px var(--red-soft)}
.result{margin-top:14px;border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--surface);border:1px solid var(--line)}
.result .pts{font-family:var(--display);font-weight:800;font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1}
.result.ok .pts{color:var(--ok)}.result.mid .pts{color:#c47a00}.result.ko .pts{color:var(--ko)}
.result .why{flex:1;min-width:0;color:var(--muted)}
.result .ans{flex-basis:100%;font-size:.95rem}
.act{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--surface);border-top:1px solid var(--line);padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}
.act .in{max-width:880px;margin:0 auto;display:flex;gap:10px;align-items:center;padding-top:10px}
.act .sc{flex:1;min-width:0;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem}
.act .sc b{color:var(--fg);font-family:var(--display);font-size:1.15rem}
.act .btn{min-width:140px;min-height:50px;font-size:1.05rem}
.kbd{color:var(--muted);font-size:.8rem;margin-top:10px}
@media (hover:none){.kbd{display:none}}
/* bilan */
.end{max-width:760px;margin:0 auto;padding-block:28px 60px;display:grid;gap:18px}
.big{font-family:var(--display);font-weight:800;font-size:clamp(3.5rem,12vw,6rem);line-height:.9;color:var(--red);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.big small{font-size:.35em;color:var(--muted)}
.end h2{margin:0;font-family:var(--display);font-size:1.6rem}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tbl div{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl div:first-child{border-top:0}
.tbl span{min-width:0;overflow-wrap:anywhere}
.end .row{display:flex;flex-wrap:wrap;gap:10px}
/* fenêtres */
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,10,14,.45);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:22px;padding:22px;width:min(520px,100%);max-height:100%;overflow:auto;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet h3{margin:0;font-family:var(--display);font-size:1.4rem}
.sheet label{display:grid;gap:6px;font-weight:600;font-size:.9rem}
.sheet input[type=text]{min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--raise);padding:0 12px;font-weight:400;font-size:1rem}
.sheet input[type=text]:focus{border-color:var(--red);outline:none}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.drop{border:2px dashed var(--line);border-radius:16px;padding:24px;text-align:center;cursor:pointer;display:grid;gap:6px;color:var(--muted)}
.drop b{color:var(--fg)}
.drop:hover,.drop.over{border-color:var(--red);background:var(--red-soft)}
.found{background:var(--raise);border-radius:12px;padding:10px 14px;font-size:.92rem}
.warn{color:var(--ko);font-size:.92rem}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px)}

/* onglets */
.top .in{flex-wrap:nowrap;gap:18px;padding-block:0;min-height:60px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav button{position:relative;white-space:nowrap;border:0;background:none;color:var(--muted);font-weight:600;font-size:.95rem;padding:19px 11px 18px;cursor:pointer;min-height:44px}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:11px;right:11px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--red)}
.pill{margin-left:6px;display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--red);color:var(--on-red);font-size:.75rem;font-variant-numeric:tabular-nums}
@media (max-width:760px){.top .in{flex-wrap:wrap;gap:0;padding-top:10px}.top .brand{padding-bottom:2px}.nav{flex-basis:100%}.nav button{padding:12px 11px 13px}}
.page{max-width:1180px;margin:0 auto;padding-block:24px 60px;display:grid;gap:22px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.head h2{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4vw,2.4rem);letter-spacing:-.02em;margin:0;line-height:1.05;text-wrap:balance}
.head p{margin:6px 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;gap:14px;min-width:0}
.panel h3{margin:0;font-size:1.1rem}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:2px}
.tile span{font-size:.85rem;color:var(--muted)}
.tile b{font-family:var(--display);font-weight:800;font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1.1}
.tile b small{font-size:.85rem;color:var(--muted);font-weight:600}
.tile.hot b{color:var(--red)}
.uegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.uetile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:10px;text-align:left;cursor:pointer}
.uetile:hover{border-color:var(--red)}
.uetile .n{font-weight:700}
.uetile .v{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.uetile .v b{font-family:var(--display);font-size:1.5rem;color:var(--fg)}
.resume{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:14px 18px;border-radius:16px;background:var(--red-soft)}
.quick{display:flex;flex-wrap:wrap;gap:10px}
.filt{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filt input[type=search]{flex:1 1 220px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
.seg.wrap{flex-wrap:wrap;border-radius:14px}
.seg.wrap button{border-radius:10px}
.row2{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 16px;align-items:start}
.row2>.lbl{font-weight:600;padding-top:8px}
@media (max-width:640px){.row2{grid-template-columns:minmax(0,1fr)}.row2>.lbl{padding-top:0}}
.picklist{border:1px solid var(--line);border-radius:14px;max-height:340px;overflow-y:auto}
.pick-h{position:sticky;top:0;background:var(--raise);padding:8px 14px;font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.pick-h button{border:0;background:none;color:var(--red);font-weight:700;font-size:.8rem;cursor:pointer;text-transform:none;letter-spacing:0}
.pick{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.pick:last-child{border-bottom:0}
.pick input{width:20px;height:20px;accent-color:var(--red);margin:0}
.pick small{color:var(--muted);font-variant-numeric:tabular-nums}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px solid var(--line)}
.foot b{font-variant-numeric:tabular-nums}
.err{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0}
.err .hd{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.err .mine{font-size:.92rem;color:var(--muted)}
.err .mine b{color:var(--fg)}
details.mini summary{cursor:pointer;color:var(--muted);font-size:.92rem;min-height:36px;display:flex;align-items:center}
.graph svg{display:block;width:100%;height:auto}
.graph .ax{font-size:11px;fill:var(--muted);font-family:var(--body)}
.graph .gl{stroke:var(--line)}
.graph .br{fill:var(--red)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:.95rem}
table.t th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t .n{text-align:right}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 20px}
.field{display:grid;gap:6px}
.field>span{font-weight:600;font-size:.92rem}
.field small{color:var(--muted);font-size:.85rem}
.field select{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--raise);padding:0 10px}
.dist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dist div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:grid}
.dist b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.dist span{color:var(--muted);font-size:.85rem}
details.rev{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.rev>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;min-height:48px}
details.rev>summary::-webkit-details-marker{display:none}
details.rev>.body{padding:0 12px 12px;display:grid;gap:8px}
.dot{width:10px;height:10px;border-radius:50%}
.dot.ok{background:var(--ok)}.dot.mid{background:#d8930f}.dot.ko{background:var(--ko)}
.more{justify-self:center}

/* v3 */
.cards{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{padding:14px;gap:8px}
.card h3{font-size:1.05rem}
.card .btn{min-height:40px;padding:8px 12px}
.card .btn.small{min-height:34px}
:root{--mid:#c47a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mid:#e5a33a}}
:root[data-theme="dark"]{--mid:#e5a33a}
